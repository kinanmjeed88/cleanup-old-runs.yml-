name: CI

# Engineering gates for the central cleanup system.
# This workflow never deletes anything and never receives the cleanup token.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, syntax and workflow permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tool tests
          echo "All Python files compile."

      - name: Import and static lint (Ruff)
        shell: bash
        run: python -m ruff check tool tests --select E9,F63,F7,F82,F401,F811,F821,F841

      - name: Workflow syntax and least-privilege check
        shell: bash
        run: python tool/check_workflow_permissions.py .github/workflows

      - name: Security scan (Bandit, medium and high severity)
        shell: bash
        run: python -m bandit -r tool -ll -q

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.y*ml"))
          assert files, "no workflow files found"
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"valid YAML: {path}")
          PY

      - name: Unit and integration tests (no network, no deletions)
        shell: bash
        run: python -m pytest -q

      - name: Workflow Bash-to-CLI integration tests (API fakes only)
        shell: bash
        run: python -m pytest -q tests/test_workflow_execution.py -v

      - name: Dry-run simulation with mocked repositories
        shell: bash
        run: python -m pytest -q tests/test_dry_run_simulation.py -v

      - name: Repository discovery tests (pagination, de-duplication, failure modes)
        shell: bash
        run: python -m pytest -q tests/test_discovery.py -v
