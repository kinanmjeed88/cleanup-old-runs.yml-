name: Central Cleanup — Workflow Runs and Merged Branches

# One central workflow that cleans every repository the cleanup token can
# manage, using the dedicated repository secret CLEANUP_TOKEN.
#
# Repositories are discovered on every run (GET /user/repos plus the accounts in
# config/accounts.txt), de-duplicated across sources and reported before any
# work starts. config/repositories.txt is only used by discovery mode `list`.
#
# Safety model:
#   * schedule        -> always DRY RUN (preview only, no deletions)
#   * workflow_dispatch mode=dry-run -> preview (default)
#   * workflow_dispatch mode=live    -> deletions, only with confirm_live=DELETE
# The workflow token is read-only; all deletions use CLEANUP_TOKEN.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = preview only (default). live = delete, requires confirm_live=DELETE."
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      repository:
        description: "One discovered repository (owner/name), or 'all'."
        required: false
        default: "all"
        type: string
      discovery_mode:
        description: "auto = every discovered repository, list = config only, union = both."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - list
          - union
      discovery_only:
        description: "Discover and report only; never clean anything."
        required: false
        default: false
        type: boolean
      keep_latest:
        description: "Completed workflow runs to keep per repository."
        required: false
        default: "20"
        type: string
      confirm_live:
        description: "Type DELETE to authorize live deletions."
        required: false
        default: ""
        type: string

# The central repository's own token is read-only: it only checks out code.
permissions:
  contents: read

concurrency:
  group: central-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Central cleanup
    # Scheduled and manual cleanup are confined to the default branch, so a pull
    # request or feature ref can never reach the cleanup token.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v5
        with:
          # Never persist the workflow token into the git config.
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the cleanup token is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLEANUP_TOKEN:-}" ]]; then
            echo "::error title=configuration::Repository secret CLEANUP_TOKEN is not available to this workflow. Nothing was deleted."
            exit 1
          fi
          echo "CLEANUP_TOKEN is present (its value is never printed)."

      - name: Resolve run mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm_live }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            echo "mode=dry-run" >> "${GITHUB_OUTPUT}"
            echo "::notice title=safety::Scheduled cleanup always runs in DRY RUN mode — nothing will be deleted."
            exit 0
          fi
          mode="${INPUT_MODE:-dry-run}"
          if [[ "${mode}" == "live" ]]; then
            if [[ "${INPUT_CONFIRM:-}" != "DELETE" ]]; then
              echo "::error title=safety::mode=live requires confirm_live=DELETE. Aborting; nothing was deleted."
              exit 1
            fi
            echo "::warning title=safety::LIVE deletion explicitly requested — only verified runs and merged branches are removed."
          else
            echo "mode=dry-run" >> "${GITHUB_OUTPUT}"
            echo "::notice title=safety::DRY RUN — nothing will be deleted."
            exit 0
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Run central cleanup
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          DISCOVERY_MODE: ${{ inputs.discovery_mode }}
          DISCOVERY_ONLY: ${{ inputs.discovery_only }}
        run: |
          set -euo pipefail
          args=(
            "--mode" "${RUN_MODE:-dry-run}"
            "--discovery-mode" "${DISCOVERY_MODE:-auto}"
            "--accounts" "config/accounts.txt"
            "--repository" "${TARGET_REPOSITORY:-all}"
            "--keep-latest" "${KEEP_LATEST:-20}"
            "--reports-dir" "diagnostics"
            "--central-repository" "${{ github.repository }}"
            "--current-run-id" "${{ github.run_id }}"
          )
          if [[ "${RUN_MODE:-dry-run}" == "live" ]]; then
            args+=("--confirm-live" "DELETE")
          fi
          if [[ "${DISCOVERY_ONLY:-false}" == "true" ]]; then
            args+=("--discover-only")
          fi
          python3 tool/central_cleanup.py "${args[@]}"

      - name: Show the grand total
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f diagnostics/REPORT.md ]]; then
            sed -n '1,200p' diagnostics/REPORT.md
          else
            echo "::warning::no report was produced"
          fi

      - name: Upload cleanup reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cleanup-report
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
